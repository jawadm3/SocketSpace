# SocketSpace v2 workspace.
# v1/ is deliberately NOT listed: it is the archived original and is excluded from all v2 tooling.
packages:
  - 'apps/*'
  - 'packages/*'

# Keep pnpm's package store and caches inside the project folder on the D: drive.
# See docs/technical/storage.md for why, and for the few things that cannot be moved.
storeDir: ./.pnpm-store
cacheDir: ./.cache/pnpm

# Supply-chain guard: only install package versions that have been public for at least 3 days
# (4320 minutes). Most malicious releases are detected and removed within hours.
# Do not add exemptions casually; record any exemption in docs/development/decisions.md.
minimumReleaseAge: 4320

# Install scripts of dependencies are blocked unless listed here as true. Reviewed 2026-10-02:
# - @embedded-postgres/windows-x64: its script only re-creates symlinks from a list that is empty
#   on Windows, so it is not needed.
# - esbuild: its script double-checks the platform binary, which pnpm already installs as an
#   optional package (@esbuild/<platform>), so it is not needed.
allowBuilds:
  '@embedded-postgres/windows-x64': false
  esbuild: false
