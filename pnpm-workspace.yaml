# SocketSpace v2 workspace.
# v1/ is deliberately NOT listed: it is the archived original and is excluded from all v2 tooling.
packages:
  - 'apps/*'
  - 'packages/*'

# Keep pnpm's package store and caches inside the project folder on the D: drive.
# See docs/technical/storage.md for why, and for the few things that cannot be moved.
storeDir: ./.pnpm-store
cacheDir: ./.cache/pnpm

# Supply-chain guard: only install package versions that have been public for at least 3 days
# (4320 minutes). Most malicious releases are detected and removed within hours.
# Do not add exemptions casually; record any exemption in docs/development/decisions.md.
minimumReleaseAge: 4320

# Install scripts of dependencies are blocked unless listed here as true (CI fails on any that are
# not listed). Reviewed 2026-10-02:
# - @embedded-postgres/<platform> (local PostgreSQL, D-026): "node scripts/hydrate-symlinks.js"
#   only re-creates symbolic links listed in a file inside the package itself (the PostgreSQL
#   libraries on Linux and macOS; the list is empty on Windows). The script is byte-identical in
#   every platform package (SHA-256 3596fdda55321a36..., checked for linux-x64, darwin-arm64 and
#   windows-x64 17.9.0-beta.17).
# - esbuild: its script double-checks the platform binary, which pnpm already installs as an
#   optional package (@esbuild/<platform>), so it is not needed.
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-ia32': true
  '@embedded-postgres/linux-ppc64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  esbuild: false
